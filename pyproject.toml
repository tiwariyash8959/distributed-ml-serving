[project]
name = "distributed-ml-serving"
version = "0.1.0"
description = "An experimental distributed machine learning serving system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.68",
    "protobuf>=5.29",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.68",
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
ml-serving = "ml_serving.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_serving"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "src/ml_serving/v1/prediction_pb2.py",
    "src/ml_serving/v1/prediction_pb2_grpc.py",
]
